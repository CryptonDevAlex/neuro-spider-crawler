[project]
name = "neuro-spider-backend"
version = "0.1.0"
description = "FastAPI backend for NeuroSpider visual crawler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "playwright>=1.49",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "fpdf2>=2.8",
  "sqlalchemy>=2.0",
  "apscheduler>=3.11",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
ignore = ["BLE001", "B008"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
